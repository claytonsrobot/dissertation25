[tool.poetry]
name = "dissertation25"
version = "0.0.0"
description = "Clayton takes a stab at helping his friend Michael."
authors = ["georgeclaytonbennett@gmail.coma"]
license = "BSD-3"
readme = "README.md"

# Dependencies
[tool.poetry.dependencies]
python = ">=3.12"
numpy = ">=2.2.4,<3.0.0"
matplotlib = ">=3.10.1,<4.0.0"
cmd2 = ">=2.5.11,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Disable package installation
package-mode = false