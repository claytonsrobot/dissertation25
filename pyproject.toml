[project]
name = "dissertation25"
version = "0.0.1"
description = "Clayton takes a stab at trying to help his friend Michael."
authors = [
    {name = "georgeclaytonbennett@gmail.coma"}
]
license = {text = "BSD-3"}
readme = "README.md"
requires-python = ">=3.10.2,<3.10.12"
dependencies = [
    "numpy (>=2.2.4,<3.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "cmd2 (>=2.5.11,<3.0.0)",
    "pyfiglet (>=1.0.2,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "toml (>=0.10.2,<0.11.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
